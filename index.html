<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Free Roblox Website</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #0b0b0c; 
            color: #ffffff; 
            text-align: center; 
        }
        header { 
            padding: 20px; 
            background-color: #16161a;
            border-bottom: 2px solid #2d2d34;
        }
        h1 { margin: 0; font-size: 2rem; color: #f74b48; }
        .arcade-frame-wrapper {
            max-width: 1000px;
            margin: 25px auto;
            padding: 10px;
            background-color: #16161a;
            border-radius: 12px;
            border: 1px solid #2d2d34;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        iframe {
            border: none;
            border-radius: 6px;
            background-color: #000;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Custom Roblox Web Station</h1>
        <p>Play Roblox inside my website frame completely free 24/7!</p>
    </header>

    <div class="arcade-frame-wrapper">
        <!-- This embeds the EasyFun free cloud engine player natively -->
        <iframe 
            src="https://www.easyfun.gg/cloud-games/roblox.html" 
            width="100%" 
            height="650px" 
            allow="autoplay; gamepad; fullscreen">
        </iframe>
    </div>

</body>
</html>
