<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cloud Gaming Site</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #111; color: white; text-align: center; }
        header { padding: 20px; background-color: #222; }
        .container { max-width: 1000px; margin: 20px auto; padding: 10px; }
        iframe { border: none; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <header>
        <h1>Instant Web Arcade</h1>
        <p>Play Roblox instantly inside your browser without downloads!</p>
    </header>

    <div class="container">
        <!-- This embeds a public, free cloud streaming frame -->
        <iframe 
            src="https://now.gg" 
            width="100%" 
            height="600px" 
            allow="autoplay; gamepad; fullscreen">
        </iframe>
    </div>

</body>
</html>
